server:
  port: 8087

spring:
  application:
    name: discount-service

  datasource:
    url: jdbc:postgresql://localhost:5432/discount_db
    username: postgres
    password: loi114
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:4321/realms/ecommerce-realm

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  elasticsearch:
    uris: http://localhost:9200

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      enabled: true
    instance:
      prefer-ip-address: true
      instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
      ip-address: ${spring.cloud.client.ip-address}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: discount-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: java.util.*,com.tlcn.*
    listener:
      ack-mode: manual_immediate
    topics:
      flash-sale: flash-sale
      discount-commands: discount.commands
      discount-events: discount.events
      discount-replies: discount.replies

  quartz:
    job-store-type: ${QUARTZ_JOB_STORE_TYPE:memory}
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
          threadPool:
            threadCount: ${QUARTZ_THREAD_COUNT:5}
          jobStore:
            misfireThreshold: ${QUARTZ_MISFIRE_THRESHOLD_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud: DEBUG
    com.netflix.discovery: DEBUG
    com.tlcn: DEBUG
    org.keycloak: DEBUG
